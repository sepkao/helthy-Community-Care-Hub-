# ╔══════════════════════════════════════════════╗
# ║  Community CareHub — SonarQube Configuration ║
# ╚══════════════════════════════════════════════╝

# ── Project Identification ──
# ต้องตรงกับ Project Key ใน SonarQube Dashboard
sonar.projectKey=community-carehub
sonar.projectName=Community CareHub
sonar.projectVersion=1.0

# ── Source Directories ──
# กำหนด path ของ source code ที่ต้องการวิเคราะห์
# (relative จาก root ของ repo)
sonar.sources=frontend-next/app,frontend-next/lib,backend/src

# ── Encoding ──
sonar.sourceEncoding=UTF-8

# ── Test Coverage ──
# เมื่อเพิ่ม test ในอนาคต ให้ uncomment บรรทัดนี้
# sonar.javascript.lcov.reportPaths=frontend-next/coverage/lcov.info,backend/coverage/lcov.info

# ── Files to EXCLUDE from analysis ──
# (ไม่ต้องวิเคราะห์ไฟล์เหล่านี้)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/dist/**,\
  **/.wrangler/**,\
  **/public/**,\
  **/*.config.*,\
  **/*.d.ts

# ── Files to EXCLUDE from coverage calculation ──
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/test/**,\
  **/tests/**,\
  **/__tests__/**

# ── Files to EXCLUDE from duplication detection ──
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# ── TypeScript Configuration ──
# บอก SonarQube ว่า tsconfig อยู่ที่ไหน
sonar.typescript.tsconfigPaths=\
  frontend-next/tsconfig.json,\
  backend/tsconfig.json
